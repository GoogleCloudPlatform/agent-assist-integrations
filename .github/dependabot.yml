# Dependabot configuration — grouped, scoped update trains per service/platform.
# - Security updates are grouped into production vs. development PRs so runtime
#   fixes can be prioritized and merged independently of dev/build tooling.
# - Version updates batch minor/patch updates by dependency-type while leaving
#   major bumps ungrouped for explicit review and staging E2E validation.
version: 2
updates:
  # ---------------------------------------------------------------------------
  # Core Backend (Python)
  # ---------------------------------------------------------------------------
  - package-ecosystem: "pip"
    directory: "/aa-integration-backend/ui-connector"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "backend"
    commit-message:
      prefix: "chore(deps)"
    groups:
      security-updates:
        applies-to: security-updates
        patterns:
          - "*"
      minor-patch:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"
        patterns:
          - "*"

  - package-ecosystem: "pip"
    directory: "/aa-integration-backend/cloud-pubsub-interceptor"
