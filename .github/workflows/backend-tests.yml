name: Core Backend Tests

on:
  pull_request:
    paths:
      - "aa-integration-backend/ui-connector/**"
      - "aa-integration-backend/cloud-pubsub-interceptor/**"
      - "aa-integration-backend/tests/**"
      - ".github/workflows/backend-tests.yml"
  push:
    branches: ["main"]
    paths:
      - "aa-integration-backend/ui-connector/**"
      - "aa-integration-backend/cloud-pubsub-interceptor/**"
      - "aa-integration-backend/tests/**"
      - ".github/workflows/backend-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-core-backend:
    name: Run Core Backend Unit & Integration Tests
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine@sha256:7f7d30b7fdd09467bac58198a1f166dd69789d348d4fe859cccb20e0cf287fbe
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r aa-integration-backend/ui-connector/requirements.txt
          pip install -r aa-integration-backend/cloud-pubsub-interceptor/requirements.txt
          pip install pytest websocket-client

      - name: Run UI Connector Unit Tests
        env:
          GCP_PROJECT_ID: fake-project
          LOGGING_FILE: /tmp/ui-connector-unit.log
          JWT_SECRET_KEY_PATH: /tmp/jwt_secret_key
        run: |
          printf 'unit-test-jwt-secret-key-at-least-32-bytes!' > /tmp/jwt_secret_key
          python -m pytest -v aa-integration-backend/ui-connector/unit_test.py

      - name: Run UI Connector WebChannel Unit Tests
        env:
          GCP_PROJECT_ID: fake-project
        run: |
          python -m pytest -v aa-integration-backend/ui-connector/webchannel_test.py

      - name: Run Cloud Pub/Sub Interceptor Unit Tests
        env:
          GCP_PROJECT_ID: fake-project
          LOGGING_FILE: /tmp/pubsub-unit.log
        run: |
          python -m pytest -v aa-integration-backend/cloud-pubsub-interceptor/unit_test.py

      - name: Run Core Backend Real-Protocol Integration Tests
        env:
          INTEGRATION_REDIS_HOST: 127.0.0.1
          INTEGRATION_REDIS_PORT: "6379"
        run: |
          python -m pytest -v aa-integration-backend/tests/integration_test.py
